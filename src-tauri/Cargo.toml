[package]
name = "emailfileviewer"
version = "0.1.0"
description = "Desktop viewer for .eml and .msg email files"
authors = ["real-zony"]
license = "MIT"
repository = "https://github.com/real-zony/EmailFileViewer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "emailfileviewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
url = "2"

[profile.release]
# 发布的程序里不带符号表和调试信息（体积更小，deb 和 AppImage 里的可执行文件也不会带 .symtab）
strip = true
