[package]
name = "emailfileviewer"
version = "0.1.0"
description = "Desktop viewer for .eml and .msg email files"
authors = ["real-zony"]
license = "MIT"
repository = "https://github.com/real-zony/EmailFileViewer"
edition = "2024"
rust-version = "1.90"

[lib]
name = "emailfileviewer_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
