name: ui

# 只在前端相关的内容变化时运行
on:
  push:
    branches: ['**']
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'
  pull_request:
    paths:
      - 'ui/**'
      - '.github/workflows/ui.yml'

permissions:
  contents: read

jobs:
  ui:
    name: ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ui

    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      # Node 24：满足 Vite 8（^20.19 || >=22.12）和 jsdom（^24.15），并默认支持直接运行 .ts 脚本
      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: Lint（警告也视为失败）
        run: npm run lint -- --deny-warnings

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试（Vitest）
        run: npm test

      - name: 对比度检查（每套配色的浅色和深色）
        run: npm run contrast

      - name: 检查 themes.css 与配色数据一致
        run: npm run themes:check

      - name: 生产构建
        run: npx vite build
